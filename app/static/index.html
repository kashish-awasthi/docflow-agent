<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocFlow Agent</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2128;--muted:#667085;--line:#e4e7ec;--accent:#2f6fde;--ok:#1a7f4b;--warn:#b54708;--bad:#c4320a}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;padding:16px 24px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2f6;white-space:nowrap}
.ready_to_pay,.approved{background:#e3f5ec;color:var(--ok)}.awaiting_approval{background:#fff2e0;color:var(--warn)}.flagged{background:#fde8e3;color:var(--bad)}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--accent);background:#eef4ff}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
input[type=text]{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.row{display:flex;gap:8px}#chat{max-height:420px;overflow:auto;margin-bottom:10px}
.msg{padding:8px 10px;border-radius:8px;margin:6px 0;white-space:pre-wrap}.me{background:#eef4ff}.bot{background:#f2f4f7}
.step{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
ul.actions{list-style:none;padding:0;margin:0;font-size:13.5px}ul.actions li{padding:6px 0;border-bottom:1px solid var(--line)}
</style></head><body>
<header><h1>DocFlow Agent</h1><span id="status" class="muted">checking…</span></header>
<main>
<section>
  <div class="card"><h2>Upload documents</h2>
    <label id="drop">Drop invoices, emails (.eml), PDFs or text files here, or click to choose
      <input id="file" type="file" multiple hidden></label>
    <div id="log" class="muted" style="margin-top:8px"></div></div>
  <div class="card"><h2>Invoices</h2>
    <table><thead><tr><th>Vendor</th><th>Number</th><th>Due</th><th style="text-align:right">Total</th><th>Status</th><th>ID</th></tr></thead>
    <tbody id="inv"></tbody></table></div>
</section>
<section>
  <div class="card"><h2>Ask the agent</h2>
    <div id="chat"><div class="muted">Try: “Which invoices are due this week?”, “What are the payment terms from Acme?”, “Approve the Bright Office invoice”, “Draft an email to the vendor of the flagged invoice”.</div></div>
    <form id="ask" class="row"><input id="q" type="text" placeholder="Ask or give a task…" autocomplete="off"><button>Send</button></form></div>
  <div class="card"><h2>Actions taken</h2><ul id="acts" class="actions"></ul></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json()).detail||r.statusText);return r.json()}
async function refresh(){
  const [inv,acts,st]=await Promise.all([j('/api/invoices'),j('/api/actions'),j('/api/status')]);
  $('#status').textContent=`${st.documents} documents · LLM ${st.llm?'connected':'offline (start Ollama)'}`;
  $('#inv').innerHTML=inv.map(i=>`<tr><td>${esc(i.vendor)}</td><td>${esc(i.invoice_number)}</td><td>${esc(i.due_date||'–')}</td>
   <td class="num">${i.total!=null?esc(i.currency)+' '+i.total.toLocaleString('en-IN'):'–'}</td><td><span class="pill ${i.status}">${esc(i.status.replace(/_/g,' '))}</span></td><td class="muted">${i.doc_id}</td></tr>`).join('')||'<tr><td colspan=6 class="muted">No invoices yet</td></tr>';
  $('#acts').innerHTML=acts.map(a=>`<li><b>${esc(a.type.replace(/_/g,' '))}</b> <span class="muted">${esc(a.doc_id||'')} · ${esc(a.source)}</span><br>${esc(a.detail.reason||a.detail.subject||'')}${a.detail.body?`<div class="muted">To: ${esc(a.detail.to)}<br>${esc(a.detail.body)}</div>`:''}</li>`).join('')||'<li class="muted">Nothing yet</li>';
}
async function upload(files){for(const f of files){
  $('#log').textContent=`Processing ${f.name}…`;const fd=new FormData();fd.append('file',f);
  try{const r=await j('/api/upload',{method:'POST',body:fd});$('#log').textContent=`${f.name}: ${r.status.replace(/_/g,' ')}`+(r.actions?.length?` (${r.actions.map(a=>a.type).join(', ')})`:'')}
  catch(e){$('#log').textContent=`${f.name}: ${e.message}`}
  await refresh()}}
const drop=$('#drop');$('#file').onchange=e=>upload(e.target.files);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');upload(e.dataTransfer.files)};
$('#ask').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';
  const chat=$('#chat');chat.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(q)}</div>`);
  const wait=document.createElement('div');wait.className='msg bot';wait.textContent='Thinking…';chat.append(wait);chat.scrollTop=1e9;
  try{const r=await j('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    wait.innerHTML=r.steps.map(s=>`<div class="step">→ ${esc(s.tool)}(${esc(JSON.stringify(s.args))})</div>`).join('')+esc(r.answer)}
  catch(err){wait.textContent='Error: '+err.message}
  chat.scrollTop=1e9;refresh()};
refresh();
</script></body></html>
